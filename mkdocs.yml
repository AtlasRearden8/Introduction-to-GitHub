      - "2 · Create Your Account & Get Set Up": 02-account-and-setup.md
  - "🛠️ The Basics":
      - "3 · Your First Repository": 03-first-repository.md
      - "4 · Markdown: Write Like a Pro": 04-markdown.md
      - "5 · GitHub Desktop on Your Computer": 05-github-desktop.md
      - "6 · Connecting Your Computer to GitHub": 06-clone-push-pull.md
  - "🤝 Working Together":
      - "7 · Branches & Merging": 07-branches-and-merging.md
      - "8 · Pull Requests": 08-pull-requests.md
      - "9 · Issues & Project Boards": 09-issues-and-projects.md
      - "10 · Collaborating & Open Source": 10-collaboration-and-open-source.md
      - "11 · Reviews, Feedback & Teamwork": 11-reviews-and-teamwork.md
  - "🧯 Mastery":
