site_name: Introduction to GitHub
site_description: >-
  A complete, friendly guide to Git and GitHub for absolute beginners, starting from
  square one: accounts, commits, branches, pull requests, issues and open source.
site_url: https://atlasrearden8.github.io/Introduction-to-GitHub/
repo_url: https://github.com/AtlasRearden8/Introduction-to-GitHub
repo_name: AtlasRearden8/Introduction-to-GitHub
docs_dir: guide
copyright: Made with ❤️ and Claude Code · Now go build something fun ✨

theme:
  name: material
  language: en
  favicon: assets/favicon.svg
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono
  icon:
    logo: material/source-branch
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - content.code.copy
    - navigation.instant
    - navigation.tracking
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow

validation:
  anchors: warn
  unrecognized_links: warn

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - sane_lists
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

nav:
  - "🏠 Home": index.md
  - "📄 Download the PDF": download.md
  - "🌱 Start Here":
      - "0 · Start Here": 00-start-here.md
